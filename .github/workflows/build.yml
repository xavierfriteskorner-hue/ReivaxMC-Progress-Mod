name: Build ReivaxMC Progress

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Compiler le mod
        run: |
          set -o pipefail
          gradle build --no-daemon --stacktrace 2>&1 | tee build_output.txt

      - name: Publier les erreurs si échec (branche _cierrors)
        if: failure()
        run: |
          {
            echo "Build échoué — $(date -u)"
            echo "===================== ERREURS ====================="
            grep -nE "error:|\.java:[0-9]+:|BUILD FAILED|FAILURE:|What went wrong|Caused by:|> Task .*FAILED" build_output.txt || echo "(aucun motif d'erreur reconnu — voir le journal ci-dessous)"
            echo ""
            echo "================= 250 DERNIÈRES LIGNES ============="
            tail -n 250 build_output.txt
          } > _build_errors.txt
          git config user.name "reivax-ci-bot"
          git config user.email "ci@reivax.local"
          git checkout --orphan _cierrors
          git rm -rf --cached . >/dev/null 2>&1 || true
          git add -f _build_errors.txt
          git commit -m "CI errors [skip ci]"
          git push -f origin _cierrors

      - name: Publier le journal complet (toujours)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build_output.txt
          if-no-files-found: warn

      - name: Publier le fichier du mod (.jar) si succès
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ReivaxMC-Progress-mod
          path: build/libs/*.jar
          if-no-files-found: error
