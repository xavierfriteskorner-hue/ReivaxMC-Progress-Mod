name: Build ReivaxMC Progress

# Se lance à chaque envoi de code, et peut aussi être lancé à la main.
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Compiler le mod
        run: |
          set +e
          gradle build --no-daemon --stacktrace 2>&1 | tee build_output.txt
          code=${PIPESTATUS[0]}
          if [ $code -ne 0 ]; then
            {
              echo "## ❌ Échec de compilation"
              echo '```'
              grep -nE "error:|\.java:|Caused by|FAILURE:|What went wrong|> Task|BUILD FAILED" build_output.txt | tail -n 80
              echo '```'
              echo "<details><summary>Fin du journal complet</summary>"
              echo ''
              echo '```'
              tail -n 150 build_output.txt
              echo '```'
              echo "</details>"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $code

      - name: Publier le journal de build (toujours)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build_output.txt
          if-no-files-found: warn

      - name: Publier le fichier du mod (.jar)
        uses: actions/upload-artifact@v4
        with:
          name: ReivaxMC-Progress-mod
          path: build/libs/*.jar
          if-no-files-found: error
