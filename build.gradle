plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.143'
}

version = '0.5.0'
group = 'fr.reivaxmc.progress'

base {
    archivesName = 'reivaxmc_progress'
}

// Mojang livre Java 21 avec Minecraft 1.21.1 : le mod cible donc Java 21.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

neoForge {
    // Version de NeoForge pour Minecraft 1.21.1 (celle du mod d'origine).
    version = '21.1.248'

    // Déclare le mod pour la validation de neoforge.mods.toml.
    mods {
        "reivaxmc_progress" {
            sourceSet(sourceSets.main)
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
