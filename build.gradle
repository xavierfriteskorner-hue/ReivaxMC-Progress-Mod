plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.143'
}

version = '0.7.4'
group = 'fr.reivaxmc.progress'

base {
    archivesName = 'reivaxmc_progress'
}

repositories {
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content { includeGroup 'software.bernie.geckolib' }
    }
}

dependencies {
    // GeckoLib : moteur d'animation pour les modèles 3D custom (Veilleur, Protecteur).
    // À installer aussi côté joueur (mod requis) pour NeoForge 1.21.1.
    implementation 'software.bernie.geckolib:geckolib-neoforge-1.21.1:4.7.3'
}

// Mojang livre Java 21 avec Minecraft 1.21.1 : le mod cible donc Java 21.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

neoForge {
    // Version de NeoForge pour Minecraft 1.21.1 (celle du mod d'origine).
    version = '21.1.248'

    // Déclare le mod pour la validation de neoforge.mods.toml.
    mods {
        "reivaxmc_progress" {
            sourceSet(sourceSets.main)
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
